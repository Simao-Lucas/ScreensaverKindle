<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Biblioteca · ScreensaverKindle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="shell library-shell">
    <p class="back"><a href="{{ url_for('main.home') }}">← Início</a></p>
    <header class="brand">
      <p class="eyebrow">KOReader · remoto</p>
      <h1>Biblioteca</h1>
      <p class="lede">Explorador de <code>{{ documents_dir }}</code> no Kindle (<code>{{ host }}</code>). Arraste para mover; pastas <code>.sdr</code> acompanham o livro. Após mudar coleções, reinicie o KOReader.</p>
    </header>

    <section class="explorer-layout">
      <aside class="explorer-tree-pane" aria-label="Pastas">
        <div class="explorer-tree-head">Pastas</div>
        <div class="folder-tree" id="folderTree"></div>
      </aside>

      <section class="explorer-main">
        <div class="explorer-toolbar">
          <button type="button" class="btn ghost" id="upBtn" title="Pasta acima">↑</button>
          <nav class="breadcrumb" id="breadcrumb" aria-label="Caminho"></nav>
          <div class="explorer-actions">
            <button type="button" class="btn" id="newFolderBtn">Nova pasta</button>
            <button type="button" class="btn" id="cutBtn" disabled>Recortar</button>
            <button type="button" class="btn" id="pasteBtn" disabled>Colar</button>
            <button type="button" class="btn" id="refreshBtn">Atualizar</button>
          </div>
        </div>

        <div class="explorer-table-wrap">
          <table class="explorer-table" id="explorerTable">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Tipo</th>
                <th>Tamanho</th>
              </tr>
            </thead>
            <tbody id="explorerBody"></tbody>
          </table>
          <p class="book-empty" id="emptyHint" hidden>Pasta vazia.</p>
        </div>
        <p class="message" id="listMessage" role="status"></p>
      </section>
    </section>

    <div class="context-menu" id="contextMenu" hidden>
      <button type="button" data-action="open">Abrir</button>
      <button type="button" data-action="cut">Recortar</button>
      <button type="button" data-action="paste">Colar aqui</button>
      <button type="button" data-action="rename">Renomear</button>
      <button type="button" data-action="delete" class="danger-text">Excluir</button>
      <button type="button" data-action="mkdir">Nova pasta</button>
    </div>

    <section class="meta-panel detail-panel" id="detailPanel" hidden>
      <h2 class="meta-heading" id="detailTitle">Livro</h2>
      <p class="field-hint" id="detailFile"></p>

      <div class="meta-grid">
        <label class="field">
          <span class="field-label">Título</span>
          <input type="text" id="dTitle" />
        </label>
        <label class="field">
          <span class="field-label">Autores</span>
          <input type="text" id="dAuthors" />
        </label>
        <label class="field">
          <span class="field-label">Editora</span>
          <input type="text" id="dPublisher" />
        </label>
        <label class="field">
          <span class="field-label">Série</span>
          <input type="text" id="dSeries" />
        </label>
        <label class="field">
          <span class="field-label">Tags</span>
          <input type="text" id="dTags" />
        </label>
        <label class="field">
          <span class="field-label">Idioma</span>
          <input type="text" id="dLanguage" />
        </label>
        <label class="field field-span">
          <span class="field-label">Comentários</span>
          <textarea id="dComments" rows="3"></textarea>
        </label>
      </div>

      <div class="cover-row">
        <div>
          <p class="field-label">Capa</p>
          <input type="file" id="dCoverInput" accept="image/png,image/jpeg,image/webp,image/bmp,image/gif" hidden />
          <button type="button" class="btn ghost" id="dCoverBtn">Trocar capa</button>
        </div>
        <figure class="cover-frame" id="dCoverFrame" data-empty="true">
          <img id="dCoverPreview" alt="Capa" hidden />
          <figcaption>cover.jpg</figcaption>
        </figure>
      </div>

      <div class="membership" id="membership"></div>

      <div class="controls meta-controls">
        <button type="button" class="btn primary" id="saveMetaBtn">Salvar metadados</button>
        <button type="button" class="btn" id="toggleFavBtn">Favorito</button>
        <button type="button" class="btn danger" id="deleteBookBtn">Excluir livro</button>
        <button type="button" class="btn ghost" id="closeDetailBtn">Fechar</button>
      </div>
      <p class="message" id="detailMessage" role="status"></p>
    </section>
  </main>

  <script src="{{ url_for('static', filename='library.js') }}"></script>
</body>
</html>
