services:
  screensaverkindle:
    build: .
    container_name: screensaverkindle
    restart: unless-stopped
    # Mesma rede do Ubuntu — necessário para IPs tipo 10.42.0.x (USB/hotspot)
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./secrets:/keys:ro
    environment:
      PORT: "8080"
      KINDLE_SSH_KEY: /keys/id_rsa
