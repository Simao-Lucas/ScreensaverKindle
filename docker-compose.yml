services:
  screensaverkindle:
    build: .
    container_name: screensaverkindle
    restart: unless-stopped
    # Mesma rede do Ubuntu — necessário para IPs tipo 10.42.0.x (hotspot)
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./secrets:/keys:ro
    environment:
      # Porta da UI no host. Se 8080 estiver ocupada, mude no .env (ex.: PORT=8090)
      PORT: ${PORT:-8080}
